<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    :root {
      --bg: #111;
      --panel: #1c1c1c;
      --text: #f5f5f5;
      --muted: #bdbdbd;
      --accent: #4caf50;
      --danger: #ff5252;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .card {
      background: var(--panel);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      font-weight: bold;
    }

    canvas {
      background: #000;
      border: 3px solid #2a2a2a;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      display: block;
      margin: 0 auto 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .start-btn {
      background: var(--accent);
      color: white;
    }

    .restart-btn {
      background: var(--danger);
      color: white;
    }

    .back-link {
      display: inline-block;
      margin-top: 8px;
      color: #8ab4ff;
      text-decoration: none;
    }

    .mobile-controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 70px);
      justify-content: center;
      gap: 8px;
    }

    .mobile-controls button {
      background: #2c2c2c;
      color: white;
      min-height: 52px;
    }

    .mobile-controls .blank {
      visibility: hidden;
    }

    @media (min-width: 900px) {
      .mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Snake</h1>
      <p>Use arrow keys or WASD. Eat food, avoid walls, don't hit yourself.</p>

      <div class="topbar">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="highScore">0</span></div>
      </div>

      <canvas id="game" width="420" height="420"></canvas>

      <div class="buttons">
        <button class="start-btn" id="startBtn">Start</button>
        <button class="restart-btn" id="restartBtn">Restart</button>
      </div>

      <div id="status">Press Start to play.</div>

      <div class="mobile-controls">
        <div class="blank"></div>
        <button data-dir="up">▲</button>
        <div class="blank"></div>

        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>

      <a class="back-link" href="/">← Back to game list</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const gridSize = 21;
    const tileSize = canvas.width / gridSize;

    let snake;
    let food;
    let dir;
    let nextDir;
    let score;
    let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
    let gameLoop = null;
    let running = false;

    highScoreEl.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      statusEl.textContent = "Game ready.";
      draw();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize)
        };
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
    }

    function startGame() {
      if (running) return;
      running = true;
      statusEl.textContent = "Playing...";
      gameLoop = setInterval(step, 120);
    }

    function stopGame(message) {
      running = false;
      clearInterval(gameLoop);
      gameLoop = null;
      statusEl.textContent = message;
    }

    function restartGame() {
      clearInterval(gameLoop);
      gameLoop = null;
      running = false;
      resetGame();
      startGame();
    }

    function step() {
      dir = nextDir;

      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      const hitWall =
        head.x < 0 ||
        head.y < 0 ||
        head.x >= gridSize ||
        head.y >= gridSize;

      const hitSelf = snake.some(seg => seg.x === head.x && seg.y === head.y);

      if (hitWall || hitSelf) {
        stopGame("Game over. Press Restart to try again.");
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem("snakeHighScore", highScore);
          highScoreEl.textContent = highScore;
        }

        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function drawBoard() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#151515";
      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tileSize, 0);
        ctx.lineTo(i * tileSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tileSize);
        ctx.lineTo(canvas.width, i * tileSize);
        ctx.stroke();
      }
    }

    function drawSnake() {
      snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? "#7CFC00" : "#4caf50";
        ctx.fillRect(
          seg.x * tileSize + 1,
          seg.y * tileSize + 1,
          tileSize - 2,
          tileSize - 2
        );
      });
    }

    function drawFood() {
      ctx.fillStyle = "#ff5252";
      ctx.beginPath();
      ctx.arc(
        food.x * tileSize + tileSize / 2,
        food.y * tileSize + tileSize / 2,
        tileSize / 2.8,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function draw() {
      drawBoard();
      drawFood();
      drawSnake();
    }

    function setDirection(newDirection) {
      const opposite =
        dir.x + newDirection.x === 0 &&
        dir.y + newDirection.y === 0;

      if (!opposite) {
        nextDir = newDirection;
      }
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " "].includes(key)) {
        e.preventDefault();
      }

      if (key === "arrowup" || key === "w") setDirection({ x: 0, y: -1 });
      if (key === "arrowdown" || key === "s") setDirection({ x: 0, y: 1 });
      if (key === "arrowleft" || key === "a") setDirection({ x: -1, y: 0 });
      if (key === "arrowright" || key === "d") setDirection({ x: 1, y: 0 });
      if (key === " " && !running) startGame();
    });

    document.querySelectorAll(".mobile-controls button[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const d = btn.dataset.dir;
        if (d === "up") setDirection({ x: 0, y: -1 });
        if (d === "down") setDirection({ x: 0, y: 1 });
        if (d === "left") setDirection({ x: -1, y: 0 });
        if (d === "right") setDirection({ x: 1, y: 0 });
      });
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", restartGame);

    resetGame();
  </script>
</body>
</html>
